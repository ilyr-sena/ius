name: probe-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["probe/**", ".github/workflows/probe-build.yml"]

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Require ScreenCaptureKit in iOS SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          if [ ! -e "$SDK/System/Library/Frameworks/ScreenCaptureKit.framework" ]; then
            echo "::error::ScreenCaptureKit.framework missing from iphoneos SDK — need iOS 27+ SDK (Xcode 27+)"
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: probe
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: probe
        run: |
          xcodebuild build \
            -project IUSProbe.xcodeproj \
            -scheme IUSProbe \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        working-directory: probe
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry IUSProbe-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IUSProbe-unsigned-ipa
          path: probe/IUSProbe-unsigned.ipa
