name: IUSProbe
options:
  bundleIdPrefix: dev.ius
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  ProbeApp:
    type: application
    platform: iOS
    sources: [ProbeApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ius.probe.app
    info:
      path: ProbeApp/Info.plist
      properties:
        CFBundleDisplayName: IUSProbeTarget
        UILaunchScreen: {}

  IUSProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ProbeUITests]
    dependencies:
      - target: ProbeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ius.probe.uitests
        TEST_TARGET_NAME: ProbeApp
    info:
      path: ProbeUITests/Info.plist
      properties:
        CFBundleDisplayName: IUSProbeUITests
        UIBackgroundModes: [screen-capture]

schemes:
  IUSProbe:
    build:
      targets:
        ProbeApp: all
        IUSProbeUITests: all
    test:
      gatherCoverageData: false
      targets: [IUSProbeUITests]
