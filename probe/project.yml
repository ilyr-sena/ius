name: IUSProbe
options:
  bundleIdPrefix: dev.ius
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  ProbeApp:
    type: application
    platform: iOS
    sources: [ProbeApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ius.probe.app
    info:
      path: ProbeApp/Info.plist
      properties:
        CFBundleDisplayName: IUSProbe
        UILaunchScreen: {}
        UIBackgroundModes: [screen-capture]
        NSScreenCaptureUsageDescription: The probe streams the full screen to measure encoder behavior.
        NSLocalNetworkUsageDescription: The probe serves its status over a local HTTP port.

schemes:
  IUSProbe:
    build:
      targets:
        ProbeApp: all
