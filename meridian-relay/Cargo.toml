[package]
name = "meridian-relay"
version = "0.3.0"
edition = "2024"
description = "Cross-platform USB multiplexing relay daemon for iOS devices (usbmuxd-compatible)"
license = "GPL-2.0-or-later"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "io-util", "time", "process", "fs", "net"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
futures = "0.3"
plist = "1"
toml = "1.1.4"
rand = "0.10"

[target.'cfg(unix)'.dependencies]
rusb = "0.9"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Statically build libusb so the shipped .exe has no DLL dependencies.
rusb = { version = "0.9", features = ["vendored"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Devices_DeviceAndDriverInstallation",
] }
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
